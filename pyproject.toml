[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opentool-python"
version = "0.1.0"
description = "Python SDK for OpenTool-compatible clients and servers"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "OpenTool Hub" }
]
license = { text = "MIT" }
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent"
]
dependencies = ["jsonschema[format]>=4.22,<5", "referencing>=0.30,<1"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
