[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opentool-python"
version = "0.1.0"
description = "Python SDK for OpenTool-compatible clients and servers"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "OpenTool Hub" }
]
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent"
]
dependencies = ["jsonschema[format]>=4.22,<5", "referencing>=0.30,<1"]

[project.urls]
Repository = "https://github.com/opentool-hub/opentool-python"
Issues = "https://github.com/opentool-hub/opentool-python/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
